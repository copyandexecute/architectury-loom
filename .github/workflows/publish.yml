name: Publish
on:
  push:
    branches:
      - 'dev/1.13'
      - 'dev/1.15'
      - 'dev/1.15-with-legacy-support'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build and Publish
        run: ./gradlew build publish exportVersion -x test --stacktrace
        env:
          NORISK_NEXUS_USERNAME: ${{ secrets.NORISK_NEXUS_USERNAME }}
          NORISK_NEXUS_PASSWORD: ${{ secrets.NORISK_NEXUS_PASSWORD }}

      - name: Read version
        id: version
        run: echo "version=$(cat build/version.txt)" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release version ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
